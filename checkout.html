<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh toán | Cyber B</title>
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://emtenlamua.github.io/cyberb-facebook/checkout.html">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QW3TSMDH34"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QW3TSMDH34');
  </script>
</head>
<body>

  <!-- Header Section -->
  <header class="top">
    <a class="logo" href="index.html">Cyber<span>B</span></a>
    <nav>
      <a href="cart.html">Quay lại giỏ hàng</a><a href="products.html">Sản phẩm</a>
      <a href="blog.html">Bài viết</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container checkout">
    <form id="checkoutForm" class="panel">
      <p class="eyebrow">HOÀN TẤT ĐƠN HÀNG</p>
      <h1>Thông tin nhận hàng</h1>

      <label>Họ và tên
        <input name="name" required>
      </label>

      <label>Số điện thoại
        <input name="phone" required pattern="[0-9+ ]{9,15}">
      </label>

      <label>Địa chỉ nhận hàng
        <input name="address" required>
      </label>

      <label>Ghi chú
        <textarea name="note" rows="3" placeholder="Ghi chú thêm (không bắt buộc)"></textarea>
      </label>

      <div id="checkoutSummary"></div>

      <button class="btn full">Đặt hàng COD</button>
      
      <p id="formMsg" class="message"></p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
